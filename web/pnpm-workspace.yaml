# 빌드 스크립트 허용 목록 (next 의 sharp, eslint 의 unrs-resolver).
# pnpm 11.19+ 는 allowBuilds 를, 10.x 는 onlyBuiltDependencies 를 읽는다 — 둘 다 유지.
allowBuilds:
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# eslint-config-next currently permits zod 4.x and resolved a release younger
# than the workspace supply-chain policy. Keep the last audited patch pinned.
overrides:
  zod: 4.5.2
